title: "LYC's notes"
markdown: kramdown
kramdown:
  input: GFM
  math_engine: null

collections:
  notes:
    output: true
    permalink: /:name.html

defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      math: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
